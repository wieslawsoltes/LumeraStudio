name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Regression tests
        run: node --experimental-sqlite --test tests/*.test.mjs
      - name: Build GitHub Pages edition
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published site and modules
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          from urllib.parse import urljoin, urlsplit
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          assert urlsplit(base).scheme == 'https'
          for path in ('', 'app/studio.js', 'app/studio.css', 'packages/core/index.js', 'packages/renderer/index.js', 'packages/controls/index.js', 'packages/collaboration/index.js', 'packages/collaboration/local.js'):
              url = urljoin(base, path)
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          body = response.read().decode('utf-8')
                          assert response.status == 200 and body
                          if not path:
                              assert 'name="lumera-storage"' in body and 'content="local"' in body
                          print('HTTP 200', url, len(body), 'characters')
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(10)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('Published site and seven critical assets verified over HTTPS: ' + base + '\n')
          PY
