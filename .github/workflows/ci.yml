name: Core, packages and browser
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Regression tests
        run: node --experimental-sqlite --test tests/*.test.mjs
      - name: Build static site and standalone packages
        run: |
          node scripts/build-pages.mjs
          node scripts/package-modules.mjs
      - name: Install browser test runner
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium
      - name: Chromium Pages smoke test
        run: python3 tests/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumera-validation
          path: |
            artifacts/*.tgz
            test-results/
          if-no-files-found: error
