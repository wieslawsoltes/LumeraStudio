<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lumera controls — standalone</title><style>body{margin:0;background:#20262e;color:#c8d2dd;font:14px system-ui}header{padding:20px}lumera-node-graph{height:65vh}pre{padding:15px;white-space:pre-wrap}</style></head><body><header>Independent graph and timeline web components. Drag nodes and connect their ports.</header><lumera-node-graph></lumera-node-graph><lumera-timeline></lumera-timeline><pre id="event"></pre><script type="module">
import '../packages/controls/index.js';
const graph=document.querySelector('lumera-node-graph');const data={nodes:[{id:'a',type:'Scene',name:'Source',x:40,y:60,enabled:true},{id:'b',type:'Output',name:'Output',x:380,y:140,enabled:true}],edges:[['a','b']]};graph.data=data;graph.addEventListener('node-move',e=>{Object.assign(data.nodes.find(n=>n.id===e.detail.id),e.detail);graph.data=data});for(const type of ['node-select','connect','edge-select'])graph.addEventListener(type,e=>document.querySelector('pre').textContent=type+' '+JSON.stringify(e.detail));const timeline=document.querySelector('lumera-timeline');timeline.data={frame:1,start:1,end:120,fps:24};timeline.addEventListener('frame',e=>{timeline.data={...timeline.value,frame:e.detail.frame}});
</script></body></html>
