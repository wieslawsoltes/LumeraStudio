<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumera renderer — standalone example</title><style>body{margin:0;background:#1d232a;color:#c5d0dc;font:14px system-ui}header{height:60px;display:flex;align-items:center;gap:20px;padding:0 25px}main{height:calc(100vh - 60px)}canvas{width:100%;height:100%;display:block}input{accent-color:#efb77c}button{background:#edbb88;border:0;border-radius:4px;padding:8px 12px;cursor:pointer}</style></head><body><header><b>Standalone renderer</b><label>Key intensity <input type="range" min="0" max="500" value="105" id="intensity"></label><span id="status"></span><button id="export">Export PNG</button></header><main><canvas></canvas></main><script type="module">
import {createScene} from '../packages/core/index.js';
import {LumeraRenderer} from '../packages/renderer/index.js';
const scene=createScene(),renderer=await LumeraRenderer.create(document.querySelector('canvas'));renderer.addEventListener('stats',e=>document.querySelector('#status').textContent=e.detail.backend+' · '+e.detail.samples+' samples');renderer.setScene(scene);document.querySelector('#intensity').oninput=e=>{scene.lights[0].intensity=Number(e.target.value);renderer.setScene(scene)};document.querySelector('#export').onclick=async()=>{const blob=await renderer.capture(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='render.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)};
</script></body></html>
